<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grafindo Jaya Teknik — Sistem Operasional</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2A30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GJT System">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --steel-900:#1E2A30; --steel-700:#34474F; --steel-600:#44585F;
    --kraft-100:#EDE7D9; --kraft-200:#E2D9C4; --kraft-300:#D4C9AE;
    --amber-500:#DA9A2E; --amber-600:#BF8323;
    --ledger-green:#3F6B4A; --ledger-green-bg:#E4ECE2;
    --rust-600:#A8432F; --rust-600-bg:#F1E1DB;
    --ink-900:#22262A; --ink-500:#5B6058; --ink-300:#8B9088;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--kraft-100);color:var(--ink-900);-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* ---- Login ---- */
  .login-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--steel-900);}
  .login-card{background:var(--kraft-100);width:100%;max-width:360px;border-radius:6px;padding:32px 28px;margin:16px;}
  .login-logo{display:flex;justify-content:center;margin-bottom:18px;}
  .login-logo img{height:52px;}
  .login-card h2{text-align:center;font-size:16px;margin:0 0 4px;}
  .login-card .sub{text-align:center;font-size:12px;color:var(--ink-500);margin-bottom:22px;font-family:'IBM Plex Mono',monospace;}
  .login-error{background:var(--rust-600-bg);color:var(--rust-600);font-size:12.5px;padding:8px 12px;border-radius:3px;margin-bottom:14px;display:none;}
  .login-error.show{display:block;}
  .login-hint{font-size:11px;color:var(--ink-300);margin-top:16px;text-align:center;line-height:1.6;}

  /* ---- Sidebar ---- */
  .sidebar{width:250px;flex-shrink:0;background:var(--steel-900);color:#EDE7D9;display:flex;flex-direction:column;padding:18px 0 16px;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 18px 16px;border-bottom:1px solid rgba(237,231,217,0.14);margin-bottom:8px;}
  .brand img{height:26px;flex-shrink:0;}
  .brand-text{line-height:1.15;}
  .brand-text .name{font-weight:600;font-size:12.5px;letter-spacing:0.2px;}
  .brand-text .sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#B7BEB2;letter-spacing:0.3px;}
  .user-chip{display:flex;align-items:center;gap:8px;padding:8px 18px 14px;border-bottom:1px solid rgba(237,231,217,0.14);margin-bottom:8px;}
  .user-avatar{width:26px;height:26px;border-radius:50%;background:var(--amber-500);color:#1E2A30;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .user-meta{line-height:1.2;flex:1;min-width:0;}
  .user-meta .uname{font-size:12px;font-weight:500;color:#EDE7D9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .user-meta .urole{font-size:10px;color:#9CA6A0;font-family:'IBM Plex Mono',monospace;}
  .logout-btn{background:none;border:none;color:#9CA6A0;cursor:pointer;font-size:14px;flex-shrink:0;}
  .logout-btn:hover{color:#EDE7D9;}

  .nav{flex:1;overflow-y:auto;padding:0 10px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:1px;border-radius:4px;color:#C7CDC3;font-size:13px;cursor:pointer;border-left:2px solid transparent;}
  .nav-item svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;}
  .nav-item:hover{background:rgba(237,231,217,0.06);}
  .nav-item.active{background:rgba(218,154,46,0.14);color:#F3E4C4;border-left:2px solid var(--amber-500);font-weight:500;}
  .chevron{width:11px;height:11px;flex-shrink:0;margin-left:auto;stroke:#8B9488;fill:none;stroke-width:2;transition:transform .15s ease;}
  .nav-item.expanded .chevron{transform:rotate(90deg);}
  .submenu{overflow:hidden;max-height:0;transition:max-height .18s ease;}
  .submenu.open{max-height:260px;}
  .submenu-item{padding:6px 12px 6px 37px;font-size:12px;color:#AEB6A8;cursor:pointer;border-left:2px solid transparent;position:relative;}
  .submenu-item::before{content:'';position:absolute;left:23px;top:0;bottom:0;width:1px;background:rgba(237,231,217,0.14);}
  .submenu-item:hover{background:rgba(237,231,217,0.06);}
  .submenu-item.active{color:#F3E4C4;border-left:2px solid var(--amber-500);background:rgba(218,154,46,0.10);font-weight:500;}
  .sidebar-foot{padding:10px 12px 0;border-top:1px solid rgba(237,231,217,0.14);margin-top:8px;}
  .sync-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:4px;cursor:pointer;font-size:10.5px;color:#9CA6A0;font-family:'IBM Plex Mono',monospace;}
  .sync-row:hover{background:rgba(237,231,217,0.06);color:#EDE7D9;}
  .sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#63706B;}
  .sync-dot.connected{background:var(--ledger-green);}
  .sync-dot.error{background:var(--rust-600);}

  /* ---- Main ---- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 26px 14px;border-bottom:1px solid var(--kraft-300);flex-wrap:wrap;gap:8px;}
  .topbar .crumb{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-500);letter-spacing:0.2px;margin-bottom:4px;}
  .topbar h1{font-size:19px;margin:0;font-weight:600;}
  .content{padding:20px 26px 100px;flex:1;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--kraft-300);border:1px solid var(--kraft-300);margin-bottom:22px;}
  .stat{background:var(--kraft-100);padding:14px 16px;}
  .stat .label{font-size:11px;color:var(--ink-500);margin-bottom:7px;}
  .stat .value{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
  .stat .value.pos{color:var(--ledger-green);} .stat .value.neg{color:var(--rust-600);}

  .panel{background:var(--kraft-100);border:1px solid var(--kraft-300);margin-bottom:22px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid var(--kraft-300);}
  .panel-head h3{font-size:13px;margin:0;font-weight:600;}

  .ledger{width:100%;border-collapse:collapse;font-size:12.5px;}
  .ledger th{text-align:left;font-size:10.5px;color:var(--ink-500);font-weight:500;padding:7px 12px;border-bottom:1px solid var(--kraft-300);white-space:nowrap;}
  .ledger td{padding:9px 12px;border-bottom:1px solid var(--kraft-200);vertical-align:middle;}
  .ledger tbody tr:hover{background:var(--kraft-200);}
  .ledger td.num, .ledger th.num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 6px;border-radius:2px;}
  .pill.ok{background:var(--ledger-green-bg);color:var(--ledger-green);}
  .pill.bad{background:var(--rust-600-bg);color:var(--rust-600);}
  .pill.mid{background:#F1EAD8;color:var(--amber-600);}
  .row-actions{display:flex;gap:5px;justify-content:flex-end;}
  .icon-btn{width:25px;height:25px;border:1px solid var(--kraft-300);background:transparent;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-500);}
  .icon-btn:hover{background:var(--kraft-200);color:var(--ink-900);}
  .icon-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .icon-btn.print{color:var(--steel-600);}

  .empty-state{padding:36px 20px;text-align:center;color:var(--ink-500);}
  .empty-state .big{font-size:13.5px;color:var(--ink-900);font-weight:500;margin-bottom:4px;}
  .empty-state .small{font-size:12px;}

  .toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .search-input, .select-input{border:1px solid var(--kraft-300);background:var(--kraft-100);padding:8px 11px;font-size:12.5px;border-radius:3px;color:var(--ink-900);font-family:'IBM Plex Sans',sans-serif;}
  .search-input{flex:1;min-width:170px;}
  .btn{border:none;border-radius:3px;padding:8px 15px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
  .btn-primary{background:var(--steel-900);color:#EDE7D9;}
  .btn-primary:hover{background:var(--steel-700);}
  .btn-ghost{background:transparent;color:var(--ink-500);border:1px solid var(--kraft-300);}
  .btn-ghost:hover{background:var(--kraft-200);}
  .btn-sm{padding:5px 10px;font-size:11.5px;}

  .form-page{max-width:560px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;color:var(--ink-500);margin-bottom:5px;}
  .field input, .field select{width:100%;border:1px solid var(--kraft-300);background:#fff;padding:8px 10px;font-size:13px;border-radius:3px;font-family:'IBM Plex Sans',sans-serif;color:var(--ink-900);}
  .field input.mono-input{font-family:'IBM Plex Mono',monospace;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .calc-total{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-500);margin:-4px 0 14px;}
  .calc-total b{color:var(--ink-900);font-size:15px;}
  .form-actions{display:flex;gap:10px;margin-top:4px;}
  .item-row{display:grid;grid-template-columns:2.2fr 0.7fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}
  .item-row input{width:100%;border:1px solid var(--kraft-300);padding:7px 8px;font-size:12.5px;border-radius:3px;}

  .overlay{position:fixed;inset:0;background:rgba(30,42,48,0.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--kraft-100);width:100%;max-width:460px;border-radius:4px;border:1px solid var(--kraft-300);max-height:90vh;overflow-y:auto;}
  .modal-head{padding:15px 18px;border-bottom:1px solid var(--kraft-300);display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{margin:0;font-size:14.5px;font-weight:600;}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--ink-500);font-size:18px;line-height:1;}
  .modal-body{padding:16px 18px;}
  .modal-foot{padding:13px 18px;border-top:1px solid var(--kraft-300);display:flex;justify-content:flex-end;gap:10px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--steel-900);color:#EDE7D9;padding:10px 18px;border-radius:4px;font-size:13px;z-index:100;display:flex;align-items:center;gap:8px;}
  .toast .dot-amber{width:6px;height:6px;border-radius:50%;background:var(--amber-500);}
  .soon-banner{border:1px dashed var(--kraft-300);padding:36px 22px;text-align:center;color:var(--ink-500);border-radius:4px;}

  .bottom-tabs{display:none;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(30,42,48,0.42);z-index:60;display:none;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--kraft-100);border-radius:12px 12px 0 0;padding:8px 0 20px;max-height:75vh;overflow-y:auto;}
  .sheet-handle{width:36px;height:4px;background:var(--kraft-300);border-radius:2px;margin:6px auto 10px;}
  .sheet-item{display:flex;align-items:center;gap:12px;padding:12px 20px;font-size:13.5px;color:var(--ink-900);}
  .sheet-item svg{width:16px;height:16px;stroke:var(--ink-500);fill:none;stroke-width:1.7;}

  #printArea{position:fixed;left:-9999px;top:0;width:210mm;background:#fff;color:#111;font-family:Arial,sans-serif;}

  @media (max-width:820px){
    .sidebar{display:none;}
    .content{padding:14px 14px 90px;}
    .topbar{padding:14px 14px 10px;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .bottom-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--steel-900);z-index:40;padding-bottom:env(safe-area-inset-bottom);}
    .bt-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9CA6A0;cursor:pointer;font-size:10px;}
    .bt-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;}
    .bt-item.active{color:var(--amber-500);}
    .field-row{grid-template-columns:1fr;}
    .item-row{grid-template-columns:1fr;}
  }
</style>
</head>

<div id="app"></div>
<div id="printArea"></div>

/* ============ HELPERS ============ */
function rupiah(n){ n=Number(n)||0; return 'Rp'+Math.round(n).toLocaleString('id-ID'); }
function fmtDate(d){ if(!d) return '-'; try{ return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){return d;} }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(prefix){ return (prefix?prefix+'-':'')+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(); }
function monthKey(d){ return d?d.slice(0,7):''; }
function escapeHtml(str){ return (str||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ state.toast=msg; render(); clearTimeout(window._t); window._t=setTimeout(()=>{state.toast=null;render();},2400); }

function lookupRow(entity, keyVal){
  const schema = SCHEMAS[entity]; if(!schema) return null;
  const idF = schema.idField || 'id';
  return (state.data[entity]||[]).find(r=>String(r[idF])===String(keyVal));
}
function lookupDisplay(field, value){
  if(!value) return '';
  if(field.ref==='penjualan'){
    const row = lookupRow('penjualan', value);
    if(!row) return value;
    const cust = lookupRow('masterCustomer', row.kodeCustomer);
    const brg = lookupRow('masterBarang', row.kodeBarang);
    return `${value} (${cust?cust.namaCustomer:'-'} — ${brg?brg.namaBarang:'-'})`;
  }
  const row = lookupRow(field.ref, value);
  if(!row) return value;
  return `${value} - ${row[field.refLabel]||''}`;
}
function lookupNameOnly(field, value){
  if(!value) return '-';
  if(field.ref==='penjualan'){
    const row = lookupRow('penjualan', value);
    if(!row) return value;
    const cust = lookupRow('masterCustomer', row.kodeCustomer);
    return cust?cust.namaCustomer:value;
  }
  const row = lookupRow(field.ref, value);
  return row ? row[field.refLabel] : value;
}

function relDate(offsetDays){
  const dt = new Date();
  dt.setDate(dt.getDate()+offsetDays);
  return dt.toISOString().slice(0,10);
}
function relMonth(offsetMonths){
  const dt = new Date();
  dt.setMonth(dt.getMonth()+offsetMonths);
  return dt.toISOString().slice(0,7);
}

function calcHargaJual(hargaBeli, ongkosKirim, materialHandling, marginPersen){
  const biaya = (Number(hargaBeli)||0)+(Number(ongkosKirim)||0)+(Number(materialHandling)||0);
  const margin = (Number(marginPersen)||0)/100;
  if(margin>=1) return Math.round(biaya);
  return Math.round(biaya/(1-margin));
}

    state.user = {username:found.username, role:found.role, namaLengkap:found.namaLengkap||found.username, nik:found.nik||'', kodeMitra:found.kodeMitra||''};

function canAccess(menuId){
  if(!state.user) return false;
  const m = MENU.find(mm=>mm.id===menuId);
  if(!m) return true;
  return m.roles.includes(state.user.role);
}
function subAccessible(menuId, sub){
  if(!state.user) return false;
  if(!sub.roles) return true;
  return sub.roles.includes(state.user.role);
}
function subVisibleInNav(menuId, sub){
  if(!subAccessible(menuId, sub)) return false;
  if(sub.hideForRoles && sub.hideForRoles.includes(state.user.role)) return false;
  return true;
}
function canAccessView(view){
  if(!state.user) return false;
  const parts = view.split('.');
  const m = MENU.find(mm=>mm.id===parts[0]);
  if(!m) return true;
  if(!m.roles.includes(state.user.role)) return false;
  if(parts[1] && m.submenu){
    const sub = m.submenu.find(s=>s.id===parts[1]);
    if(sub) return subAccessible(m.id, sub);
  }
  return true;
}
function firstAccessibleSub(m){
  if(!m.submenu) return m.id;
  const sub = m.submenu.find(s=>subVisibleInNav(m.id, s));
  return sub ? m.id+'.'+sub.id : m.id;
}

function renderDashboard(){
  if(state.user.role==='Mitra') return renderMitraDashboard();
  const perm = DASH_PERM[state.user.role] || {beli:false,jual:false,profit:false,expense:false,tx:'none'};
  const now = new Date(); const curMonth = now.toISOString().slice(0,7);
  const pembelian = state.data.pembelian||[], penjualan = state.data.penjualan||[];
  const pThis = pembelian.filter(p=>monthKey(p.tanggal)===curMonth);
  const jThis = penjualan.filter(p=>monthKey(p.tanggal)===curMonth);
  const totalBeli = pThis.reduce((a,p)=>a+(Number(p.qty)||0)*(Number(p.hargaSatuan)||0),0);
  const totalJual = jThis.reduce((a,p)=>a+(Number(p.qty)||0)*(Number(p.hargaJual)||0),0);
  const profit = totalJual-totalBeli;
  const expense = (state.data.operationalExpense||[]).filter(e=>monthKey(e.tanggal)===curMonth).reduce((a,e)=>a+(Number(e.jumlah)||0),0);

  const cards = [];
  if(perm.beli) cards.push(`<div class="stat"><div class="label">Pembelian bulan ini</div><div class="value mono">${rupiah(totalBeli)}</div></div>`);
  if(perm.jual) cards.push(`<div class="stat"><div class="label">Penjualan bulan ini</div><div class="value mono">${rupiah(totalJual)}</div></div>`);
  if(perm.profit) cards.push(`<div class="stat"><div class="label">Profit kotor</div><div class="value mono ${profit>=0?'pos':'neg'}">${profit>=0?'+':''}${rupiah(profit)}</div></div>`);
  if(perm.expense) cards.push(`<div class="stat"><div class="label">Biaya operasional</div><div class="value mono">${rupiah(expense)}</div></div>`);

  let recent = [];
  if(perm.tx==='all'){
    recent = [
      ...pembelian.map(p=>({...p,_type:'Pembelian',_total:(Number(p.qty)||0)*(Number(p.hargaSatuan)||0)})),
      ...penjualan.map(p=>({...p,_type:'Penjualan',_total:(Number(p.qty)||0)*(Number(p.hargaJual)||0)})),
    ];
  } else if(perm.tx==='beli'){
    recent = pembelian.map(p=>({...p,_type:'Pembelian',_total:(Number(p.qty)||0)*(Number(p.hargaSatuan)||0)}));
  } else if(perm.tx==='jual'){
    recent = penjualan.map(p=>({...p,_type:'Penjualan',_total:(Number(p.qty)||0)*(Number(p.hargaJual)||0)}));
  }
  recent = recent.sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'')).slice(0,6);

  const statRowStyle = cards.length ? `style="grid-template-columns:repeat(${cards.length},1fr);"` : '';

  return `
    ${cards.length ? `<div class="stat-row" ${statRowStyle}>${cards.join('')}</div>` : ''}
    ${perm.tx!=='none' ? `<div class="panel"><div class="panel-head"><h3>Transaksi terbaru</h3></div>
    ${recent.length===0?`<div class="empty-state"><div class="big">Belum ada transaksi</div></div>`:`
    <table class="ledger"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Barang</th><th class="num">Total</th></tr></thead>
    <tbody>${recent.map(r=>`<tr><td class="mono">${fmtDate(r.tanggal)}</td><td>${r._type}</td><td>${lookupNameOnly({ref:'masterBarang',refLabel:'namaBarang'},r.kodeBarang)}</td><td class="num">${rupiah(r._total)}</td></tr>`).join('')}</tbody></table>`}
    </div>` : ''}
  `;
}

/* ============ LAPORAN KOMISI (Mitra) ============ */
function renderLaporanKomisi(){
  const mitraList = state.data.masterMitra||[];
  let kodeMitra = state.user.role==='Mitra' ? state.user.kodeMitra : state.reportMitra;
  if(state.user.role==='Admin' && !kodeMitra && mitraList.length) kodeMitra = mitraList[0].kodeMitra;
  const mitra = mitraList.find(m=>m.kodeMitra===kodeMitra);
  const selector = state.user.role==='Admin' ? `<div class="field" style="max-width:280px;"><label>Pilih Mitra</label><select data-action="select-laporan-mitra">
      ${mitraList.map(m=>`<option value="${m.kodeMitra}" ${kodeMitra===m.kodeMitra?'selected':''}>${escapeHtml(m.namaMitra)}</option>`).join('')}
    </select></div>` : '';
  if(!mitra){
    return `<div class="panel">${selector}<div class="empty-state"><div class="big">Belum ada data Mitra</div></div></div>`;
  }
  const pct = Number(mitra.persentaseMargin)||0;
  const quotes = (state.data.quotation||[]).filter(q=>q.status==='Diterima' && quotationBelongsToMitra(q, kodeMitra)).sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
  let totalMargin=0, totalBagian=0;
  const rows = quotes.map(q=>{
    const custName = q.kodeCustomer ? lookupNameOnly({ref:'masterCustomer',refLabel:'namaCustomer'}, q.kodeCustomer) : (q.namaCustomerManual||'-');
    const items = (q.items||[]).map(it=>`${escapeHtml(it.namaBarang)} (${it.qty})`).join(', ');
    const nilai = quoTotal(q);
    const margin = quoMarginBersih(q);
    const bagian = margin*pct/100;
    totalMargin+=margin; totalBagian+=bagian;
    return `<tr><td class="mono">${fmtDate(q.tanggal)}</td><td>${escapeHtml(custName)}</td><td>${items}</td><td class="num">${rupiah(nilai)}</td><td class="num">${rupiah(margin)}</td><td class="num">${rupiah(bagian)}</td></tr>`;
  }).join('');
  return `
  ${selector?`<div class="panel">${selector}</div>`:''}
  <div class="stat-row" style="grid-template-columns:repeat(3,1fr);">
    <div class="stat"><div class="label">Total Transaksi Diterima</div><div class="value mono">${quotes.length}</div></div>
    <div class="stat"><div class="label">Total Margin Bersih</div><div class="value mono">${rupiah(totalMargin)}</div></div>
    <div class="stat"><div class="label">Total Bagian Mitra (${pct}%)</div><div class="value mono pos">${rupiah(totalBagian)}</div></div>
  </div>
  <div class="panel"><div class="panel-head"><h3>Rincian Komisi — ${escapeHtml(mitra.namaMitra)}</h3></div>
  ${quotes.length===0?`<div class="empty-state"><div class="big">Belum ada transaksi diterima dari tim ini</div></div>`:`
  <table class="ledger"><thead><tr><th>Tanggal</th><th>Customer</th><th>Barang</th><th class="num">Harga Jual (Total)</th><th class="num">Margin Bersih</th><th class="num">Bagian Mitra</th></tr></thead>
  <tbody>${rows}</tbody></table>`}
  </div>
  <div style="font-size:11px;color:var(--ink-500);margin-top:6px;">Perhitungan: Margin Bersih = Total Harga Jual − Total Biaya (Harga Beli + Ongkos Kirim + Material Handling). Bagian Mitra = Margin Bersih × ${pct}%.</div>
  `;
}

/* ============ GENERIC FORM RENDERING ============ */
function renderFormFields(entityKey, item, idPrefix){
  const schema = SCHEMAS[entityKey];
  const d = item || {};
  return schema.fields.map(f=>{
    const val = d[f.key]!==undefined?d[f.key]:'';
    const disabled = (item && schema.idField===f.key) ? 'disabled' : '';
    if(f.type==='select'){
      return `<div class="field"><label>${f.label}</label><select name="${f.key}" data-field="${f.key}">
        ${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
      </select></div>`;
    }
    if(f.type==='lookup'){
      const refData = f.ref==='penjualan' ? (state.data.penjualan||[]) : (state.data[f.ref]||[]);
      const refIdF = f.ref==='penjualan' ? 'id' : (SCHEMAS[f.ref].idField||'id');
      return `<div class="field"><label>${f.label}</label><select name="${f.key}" data-field="${f.key}" data-lookup-entity="${entityKey}">
        <option value="">- pilih -</option>
        ${refData.map(r=>`<option value="${r[refIdF]}" ${String(val)===String(r[refIdF])?'selected':''}>${lookupDisplay(f, r[refIdF])}</option>`).join('')}
      </select></div>`;
    }
    const inputType = f.type==='number'?'number':(f.type==='date'?'date':'text');
    return `<div class="field"><label>${f.label}</label><input type="${inputType}" name="${f.key}" data-field="${f.key}" class="${f.type==='number'?'mono-input':''}" value="${escapeHtml(val)}" ${disabled}></div>`;
  }).join('');
}

/* ============ GENERIC DAFTAR / TAMBAH / LAPORAN ============ */
function computedVal(entityKey, item, key){
  const schema = SCHEMAS[entityKey];
  const c = (schema.computed||[]).find(c=>c.key===key);
  return c ? c.fn(item) : item[key];
}
function colDisplay(entityKey, item, colKey, extraCtx){
  const schema = SCHEMAS[entityKey];
  const field = schema.fields.find(f=>f.key===colKey);
  if(colKey==='saldo' && entityKey==='bukuKas') return rupiah(extraCtx.saldo);
  if(field){
    if(field.type==='lookup') return escapeHtml(lookupDisplay(field, item[colKey]));
    if(field.type==='date') return fmtDate(item[colKey]);
    if(field.type==='number') return rupiah(item[colKey]);
    return escapeHtml(item[colKey]||'-');
  }
  const c = (schema.computed||[]).find(c=>c.key===colKey);
  if(c){
    const v = c.fn(item);
    if(colKey==='pencapaian') return (v*100).toFixed(1)+'%';
    if(typeof v==='number') return rupiah(v);
    return v;
  }
  return item[colKey]||'-';
}
function colLabel(entityKey, colKey){
  const schema = SCHEMAS[entityKey];
  const field = schema.fields.find(f=>f.key===colKey);
  if(field) return field.label;
  if(colKey==='saldo') return 'Saldo Berjalan';
  const c = (schema.computed||[]).find(c=>c.key===colKey);
  return c ? c.label : colKey;
}

function renderDaftar(entityKey, extraFilter){
  const schema = SCHEMAS[entityKey];
  let list = (state.data[entityKey]||[]).slice();
  if(extraFilter) list = list.filter(extraFilter);
  const q = state.search.trim().toLowerCase();
  if(q){
    list = list.filter(it=>schema.listCols.some(c=>String(it[c]||'').toLowerCase().includes(q)));
  }
  const dateField = schema.fields.find(f=>f.type==='date');
  if(dateField) list.sort((a,b)=>(b[dateField.key]||'').localeCompare(a[dateField.key]||''));

  // running saldo for bukuKas (chronological order)
  let saldoMap = {};
  if(entityKey==='bukuKas'){
    const chrono = (state.data.bukuKas||[]).slice().sort((a,b)=>(a.tanggal||'').localeCompare(b.tanggal||''));
    let running=0;
    chrono.forEach(it=>{ running += (Number(it.jumlahMasuk)||0)-(Number(it.jumlahKeluar)||0); saldoMap[it.id]=running; });
  }

  const canDelete = !isStaff();
  const canEdit = entityKey==='targetSales' ? state.user.role==='Admin' : (state.user.role!=='Mitra');
  const printType = schema.printable;

  return `
    <div class="toolbar">
      <input class="search-input" data-action="search" placeholder="Cari…" value="${escapeHtml(state.search)}">
    </div>
    <div class="panel">
      ${list.length===0?`<div class="empty-state"><div class="big">Belum ada data ${schema.label.toLowerCase()}</div></div>`:`
      <table class="ledger"><thead><tr>${schema.listCols.map(c=>`<th class="${['number'].includes((schema.fields.find(f=>f.key===c)||{}).type)||['total','nilaiBuku','totalGaji','gajiPokok','tunjangan','realisasi','saldo','targetPenjualan'].includes(c)?'num':''}">${colLabel(entityKey,c)}</th>`).join('')}<th></th></tr></thead>
      <tbody>${list.map(it=>{
        const ctx = entityKey==='bukuKas'?{saldo:saldoMap[it.id]}:{};
        return `<tr>${schema.listCols.map(c=>{
          const isStatusCol = c==='status'||c==='statusPengiriman'||c==='statusProspek'||c==='statusKaryawan';
          const raw = colDisplay(entityKey,it,c,ctx);
          const cellClass = ['number'].includes((schema.fields.find(f=>f.key===c)||{}).type)||['total','nilaiBuku','totalGaji','gajiPokok','tunjangan','realisasi','saldo','targetPenjualan'].includes(c)?'num':'';
          if(isStatusCol){
            const cls = raw==='Lunas'||raw==='Aktif'||raw==='Diterima'||raw==='Deal'?'ok':(raw==='Belum Lunas'||raw==='Nonaktif'||raw==='Batal'||raw==='Terlambat'?'bad':'mid');
            return `<td><span class="pill ${cls}">${raw}</span></td>`;
          }
          return `<td class="${cellClass}">${raw}</td>`;
        }).join('')}
        <td><div class="row-actions">
          ${printType?`<button class="icon-btn print" data-action="print-doc" data-doctype="${printType}" data-id="${it.id||it[schema.idField]}" title="Cetak">${icon('print')}</button>`:''}
          ${canEdit?`<button class="icon-btn" data-action="edit" data-entity="${entityKey}" data-id="${it.id||it[schema.idField]}">${icon('edit')}</button>`:''}
          ${canDelete?`<button class="icon-btn" data-action="delete" data-entity="${entityKey}" data-id="${it.id||it[schema.idField]}">${icon('trash')}</button>`:''}
        </div></td></tr>`;

}

function renderLaporan(entityKey){
  const schema = SCHEMAS[entityKey];
  const list = state.data[entityKey]||[];
  const dateField = schema.fields.find(f=>f.type==='date');
  const months = dateField ? Array.from(new Set(list.map(i=>monthKey(i[dateField.key])))).filter(Boolean).sort().reverse() : [];
  const period = state.reportMonth;
  const filtered = (period==='semua'||!dateField) ? list : list.filter(i=>monthKey(i[dateField.key])===period);

  const sumField = schema.reportSumField || 'total';
  const sumFn = (it)=>{
    const c = (schema.computed||[]).find(c=>c.key===sumField);
    return c ? c.fn(it) : (Number(it[sumField])||0);
  };
  const totalNilai = filtered.reduce((a,it)=>a+sumFn(it),0);

  const groupField = schema.reportGroupField;
  const groupRows = {};
  if(groupField){
    filtered.forEach(it=>{
      const gField = schema.fields.find(f=>f.key===groupField);
      const key = gField && gField.type==='lookup' ? lookupNameOnly(gField, it[groupField]) : (it[groupField]||'-');
      groupRows[key]=groupRows[key]||0; groupRows[key]+=sumFn(it);
    });
  }
  const groupArr = Object.entries(groupRows).sort((a,b)=>b[1]-a[1]);

  return `
    <div class="toolbar">
      <select class="select-input" data-action="report-month">
        <option value="semua" ${period==='semua'?'selected':''}>Semua periode</option>
        ${months.map(m=>`<option value="${m}" ${period===m?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>
    <div class="stat-row" style="grid-template-columns:repeat(2,1fr);">
      <div class="stat"><div class="label">Total transaksi</div><div class="value mono">${filtered.length}</div></div>
      <div class="stat"><div class="label">Total nilai</div><div class="value mono">${rupiah(totalNilai)}</div></div>
    </div>
    ${groupField?`<div class="panel"><div class="panel-head"><h3>Rekap per ${colLabel(entityKey,groupField)}</h3></div>
    ${groupArr.length===0?`<div class="empty-state small">Tidak ada data.</div>`:`
    <table class="ledger"><thead><tr><th>${colLabel(entityKey,groupField)}</th><th class="num">Total</th></tr></thead>
    <tbody>${groupArr.map(([k,v])=>`<tr><td>${escapeHtml(k)}</td><td class="num">${rupiah(v)}</td></tr>`).join('')}</tbody></table>`}
    </div>`:''}
  `;
}

/* ============ QUOTATION (bespoke: header + line items dengan harga otomatis) ============ */
const QUOTATION_STATUSES = ['Menunggu Referensi','Menunggu Harga','Siap Dikirim','Terkirim','Diterima','Ditolak'];
const STATUS_TRANSITIONS = {
  Admin:       QUOTATION_STATUSES,
  Procurement: ['Menunggu Referensi','Menunggu Harga'],
  Penjualan:   ['Menunggu Harga','Siap Dikirim','Terkirim'],
  Sales:       ['Terkirim','Diterima','Ditolak'],
};
function allowedQuotationStatuses(currentStatus){
  const base = STATUS_TRANSITIONS[state.user.role] || [];
  return base.includes(currentStatus) ? base : [currentStatus].filter(Boolean);
}
function quoItemHargaJual(it){ return calcHargaJual(it.hargaBeli, it.ongkosKirim, it.materialHandling, it.marginPersen!==undefined?it.marginPersen:state.settings.defaultMarginPercent); }
function quoTotal(d){
  return (d.items||[]).reduce((a,it)=>a+(Number(it.qty)||0)*quoItemHargaJual(it),0)-(Number(d.diskon)||0);
}
function resolveOrCreateCustomer(quo){
  if(quo.kodeCustomer){
    const found = (state.data.masterCustomer||[]).find(c=>c.kodeCustomer===quo.kodeCustomer);
    if(found) return found.kodeCustomer;
  }
  const nama = (quo.namaCustomerManual||'Customer '+quo.id).trim();
  const existing = (state.data.masterCustomer||[]).find(c=>(c.namaCustomer||'').toLowerCase()===nama.toLowerCase());
  if(existing) return existing.kodeCustomer;
  const newCode = uid('CUS-AUTO');
  state.data.masterCustomer = state.data.masterCustomer||[];
  state.data.masterCustomer.push({kodeCustomer:newCode, namaCustomer:nama, kontakPerson:'', telepon:'', alamat:'', terminPembayaranHari:0, keterangan:'Otomatis dibuat dari '+quo.id});
  saveEntity('masterCustomer');
  return newCode;
}
function resolveOrCreateBarang(item){
  const nama = (item.namaBarang||'').trim();
  const existing = (state.data.masterBarang||[]).find(b=>(b.namaBarang||'').toLowerCase()===nama.toLowerCase());
  if(existing) return existing.kodeBarang;
  const newCode = uid('BRG-AUTO');
  state.data.masterBarang = state.data.masterBarang||[];
  state.data.masterBarang.push({kodeBarang:newCode, namaBarang:nama, kategori:'', satuan:'', hargaBeliTerakhir:Number(item.hargaBeli)||0, hargaJualStandar:quoItemHargaJual(item), stokMinimum:0, keterangan:'Otomatis dibuat dari Quotation'});
  saveEntity('masterBarang');
  return newCode;
}
function generateInvoiceFromQuotation(quo){
  const kodeCustomer = resolveOrCreateCustomer(quo);
  const tracker = quo.salesTrackerId ? (state.data.salesTracker||[]).find(t=>t.id===quo.salesTrackerId) : null;
  const nikSales = tracker ? tracker.nikSales : '';
  state.data.penjualan = state.data.penjualan||[];
  const newIds = [];
  quo.items.forEach(item=>{
    const kodeBarang = resolveOrCreateBarang(item);
    const row = {
      id: uid('PJ'),
      tanggal: todayStr(),
      kodeCustomer,
      kodeBarang,
      qty: Number(item.qty)||0,
      hargaJual: quoItemHargaJual(item),
      nikSales,
      status: 'Belum Lunas',
      catatan: 'Otomatis dari Quotation '+quo.id,
      quotationId: quo.id,
    };
    state.data.penjualan.push(row);
    newIds.push(row.id);
  });
  saveEntity('penjualan');
  const idx = state.data.quotation.findIndex(q=>q.id===quo.id);
  if(idx>-1){
    state.data.quotation[idx].invoiceGenerated = true;
    state.data.quotation[idx].penjualanIds = newIds;
    saveEntity('quotation');
  }
  return newIds.length;
}
function generatePurchaseDraftFromQuotation(quo){
  state.data.pembelian = state.data.pembelian||[];
  const newIds = [];
  quo.items.forEach(item=>{
    const kodeBarang = resolveOrCreateBarang(item);
    const row = {
      id: uid('PB'),
      tanggal: todayStr(),
      kodeSupplier: '', // Procurement memilih/mengonfirmasi supplier aktual saat memproses
      kodeBarang,
      qty: Number(item.qty)||0,
      hargaSatuan: Number(item.hargaBeli)||0, // harga referensi saat quotation — dikonfirmasi/disesuaikan Procurement
      status: 'Belum Lunas',
      catatan: 'Draft otomatis dari Quotation '+quo.id+' (referensi lokasi: '+(item.lokasi||'-')+') — lengkapi Supplier & konfirmasi harga',
      quotationId: quo.id,
    };
    state.data.pembelian.push(row);
    newIds.push(row.id);
  });
  saveEntity('pembelian');
  const idx = state.data.quotation.findIndex(q=>q.id===quo.id);
  if(idx>-1){
    state.data.quotation[idx].pembelianGenerated = true;
    state.data.quotation[idx].pembelianIds = newIds;
    saveEntity('quotation');
  }
  return newIds.length;
}
function mitraTeamNiks(kodeMitra){
  if(!kodeMitra) return [];
  return (state.data.masterKaryawan||[]).filter(k=>k.kodeMitra===kodeMitra).map(k=>k.nik);
}
function currentMitraRecord(){
  if(!state.user || !state.user.kodeMitra) return null;
  return (state.data.masterMitra||[]).find(m=>m.kodeMitra===state.user.kodeMitra) || null;
}
function quotationOwnerNik(q){
  const tracker = q.salesTrackerId ? (state.data.salesTracker||[]).find(t=>t.id===q.salesTrackerId) : null;
  return tracker ? tracker.nikSales : '';
}
function quotationBelongsToMitra(q, kodeMitra){
  const nik = quotationOwnerNik(q);
  if(!nik) return false;
  return mitraTeamNiks(kodeMitra).includes(nik);
}
function quoBiayaTotal(q){
  return (q.items||[]).reduce((a,it)=>a+(Number(it.qty)||0)*((Number(it.hargaBeli)||0)+(Number(it.ongkosKirim)||0)+(Number(it.materialHandling)||0)),0);
}
function quoMarginBersih(q){
  return quoTotal(q) - quoBiayaTotal(q);
}
function quotationVisibleToUser(q){
  if(state.user.role==='Sales'){
    if(!q.salesTrackerId) return false;
    const tracker = (state.data.salesTracker||[]).find(t=>t.id===q.salesTrackerId);
    return !!(tracker && state.user.nik && tracker.nikSales===state.user.nik);
  }
  if(state.user.role==='Mitra'){
    return quotationBelongsToMitra(q, state.user.kodeMitra);
  }
  return true;
}

  </div>`;
}

function qInput(field, value, opts){

    title = 'QUOTATION / PENAWARAN HARGA';
    const rows = (record.items||[]).map(it=>({nama:it.namaBarang, qty:it.qty, harga:quoItemHargaJual(it)}));
    body = `<div style="margin-bottom:14px;font-size:12px;"><b>Kepada Yth:</b><br>${escapeHtml(custName)}${customer?`<br>${escapeHtml(customer.alamat||'')}<br>${escapeHtml(customer.telepon||'')}`:''}</div>
    ${itemsTableHTML(rows, true)}
    <div style="text-align:right;font-size:12px;">Diskon: ${rupiah(record.diskon||0)}</div>
    <div style="text-align:right;font-size:13px;font-weight:bold;">Total: ${rupiah(quoTotal(record))}</div>
    <div style="font-size:11px;margin-top:14px;">Berlaku hingga: ${fmtDate(record.validUntil)}<br>Catatan: ${escapeHtml(record.catatan||'-')}</div>
    ${docFooterHTML('Hormat kami','Disetujui oleh')}`;
  }
  return `<div style="padding:24px;width:210mm;min-height:280mm;">
    ${letterheadHTML()}
    <div style="text-align:center;font-size:15px;font-weight:bold;text-decoration:underline;margin-bottom:4px;">${title}</div>
    <div style="text-align:center;font-size:11px;margin-bottom:18px;">No: ${nomor} | Tanggal: ${tanggal}</div>
    ${body}
  </div>`;
}
function printDocument(doctype, id){
  let record;
  if(doctype==='po') record = lookupRow('pembelian', id);
  else if(doctype==='invoice') record = lookupRow('penjualan', id);
  else if(doctype==='suratjalan') record = lookupRow('pengiriman', id);
  else if(doctype==='quotation') record = lookupRow('quotation', id);
  if(!record){ showToast('Data tidak ditemukan'); return; }
  const html = buildDocumentHTML(doctype, record);
  const fileId = (doctype==='invoice' && record.quotationId) ? record.quotationId.replace('QUO','INV') : id;
  const container = document.getElementById('printArea');
  container.innerHTML = html;
  const opt = { margin:5, filename:`${doctype}-${fileId}.pdf`, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'mm',format:'a4',orientation:'portrait'} };
  showToast('Menyiapkan PDF…');
  html2pdf().set(opt).from(container).save().then(()=>{ container.innerHTML=''; }).catch(()=>{ showToast('Gagal membuat PDF'); container.innerHTML=''; });
}

/* ============ EVENT DELEGATION ============ */
function getFormValues(formEl, schemaFields){
  const payload = {};
  schemaFields.forEach(f=>{
    const el = formEl.querySelector(`[data-field="${f.key}"]`);
    if(!el) return;
    payload[f.key] = f.type==='number' ? Number(el.value)||0 : el.value;
  });
  return payload;
}

document.addEventListener('submit', function(e){
  if(e.target && e.target.id==='loginForm'){
    e.preventDefault();
    const fd = new FormData(e.target);
    tryLogin(fd.get('username'), fd.get('password'));
  }
});

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  if(action==='logout'){ doLogout(); return; }
  if(action==='toggle'){
    const id = el.getAttribute('data-target');
    if(state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
    render(); return;
  }
  if(action==='nav'){
    const target = el.getAttribute('data-target');
    const menuId = target.split('.')[0];
    state.expanded.add(menuId);
    state._editingQuotation = null;
    state._editingSalesTracker = null;
    state.view = target; state.search=''; state.reportMonth='semua'; state.sheetOpen=false;
    render(); return;
  }
  if(action==='open-sheet'){ state.sheetOpen=true; render(); return; }
  if(action==='close-sheet'){ state.sheetOpen=false; render(); return; }
  if(action==='open-settings'){ state.modal={type:'settings'}; render(); return; }
  if(action==='close-modal'){ state.modal=null; render(); return; }

  if(action==='print-doc'){
    printDocument(el.getAttribute('data-doctype'), el.getAttribute('data-id'));
    return;
  }

  if(action==='edit'){
    const entity = el.getAttribute('data-entity'); const id = el.getAttribute('data-id');
    if(entity==='quotation'){
      const item = (state.data.quotation||[]).find(q=>q.id===id);
      state.view='quotation.tambah'; state._editingQuotation = item; state._editingSalesTracker=null; render();
      return;
    }
    if(entity==='salesTracker'){
      const item = (state.data.salesTracker||[]).find(t=>t.id===id);
      state.view='salestracker.tambah'; state._editingSalesTracker = item; state._editingQuotation=null; render();
      return;
    }
    const item = lookupRow(entity, id);
    state.modal = {type:'edit', entity, item};
    render(); return;
  }
  if(action==='delete'){
    const entity = el.getAttribute('data-entity'); const id = el.getAttribute('data-id');
    if(isStaff()){ showToast('Staff tidak dapat menghapus data'); return; }
    if(confirm('Hapus data ini?')){
      const schema = SCHEMAS[entity]; const idF = schema?schema.idField||'id':'id';
      state.data[entity] = (state.data[entity]||[]).filter(it=>String(it[idF]!==undefined?it[idF]:it.id)!==String(id));
      saveEntity(entity); render(); showToast('Data dihapus');
    }
    return;
  }
  if(action==='search'){ return; } // handled in input listener

  if(action==='save-entry'){
    const entity = el.getAttribute('data-entity');
    const schema = SCHEMAS[entity];
    const form = document.getElementById('entryForm');
    const missing = schema.fields.filter(f=>f.required).some(f=>{
      const fe = form.querySelector(`[data-field="${f.key}"]`); return fe && !fe.value;
    });
    if(missing){ showToast('Lengkapi field yang wajib diisi'); return; }
    const payload = getFormValues(form, schema.fields);
    if(schema.idField){
      const exists = (state.data[entity]||[]).some(it=>String(it[schema.idField])===String(payload[schema.idField]));
      if(exists){ showToast('Kode sudah dipakai, gunakan kode lain'); return; }
    } else {
      payload.id = uid(schema.idPrefix);
    }
    state.data[entity] = state.data[entity]||[];
    state.data[entity].push(payload);
    saveEntity(entity);
    state.view = defaultDaftarView(entity);
    render();
    showToast(`${schema.label} berhasil ditambahkan`);
    return;
  }
  if(action==='save-generic-inline'){
    const entity = el.getAttribute('data-entity');
    const schema = SCHEMAS[entity];
    const container = el.closest('.panel').querySelector('.modal-body');
    const missing = schema.fields.filter(f=>f.required).some(f=>{
      const fe = container.querySelector(`[data-field="${f.key}"]`); return fe && !fe.value;
    });
    if(missing){ showToast('Lengkapi field yang wajib diisi'); return; }
    const payload = {};
    schema.fields.forEach(f=>{
      const fe = container.querySelector(`[data-field="${f.key}"]`);
      if(fe) payload[f.key] = f.type==='number'?Number(fe.value)||0:fe.value;
    });
    if(!schema.idField) payload.id = uid(schema.idPrefix);
    else {
      const exists = (state.data[entity]||[]).some(it=>String(it[schema.idField])===String(payload[schema.idField]));
      if(exists){ showToast('Kode sudah dipakai, gunakan kode lain'); return; }
    }
    state.data[entity] = state.data[entity]||[];
    state.data[entity].push(payload);
    saveEntity(entity); render();
    showToast(`${schema.label} berhasil ditambahkan`);
    return;
  }
  if(action==='save-edit'){
    const entity = el.getAttribute('data-entity'); const id = el.getAttribute('data-id');
    const schema = SCHEMAS[entity];
    const form = document.getElementById('editForm');
    const payload = getFormValues(form, schema.fields);
    const idF = schema.idField || 'id';
    const idx = (state.data[entity]||[]).findIndex(it=>String(it[idF]!==undefined?it[idF]:it.id)===String(id));
    if(idx>-1){
      const original = state.data[entity][idx];
      state.data[entity][idx] = {...original, ...payload};
      if(!schema.idField) state.data[entity][idx].id = original.id;
      saveEntity(entity);
    }
    state.modal=null; render(); showToast('Perubahan disimpan');
    return;
  }

  if(action==='add-item-row'){
    const rowType = el.getAttribute('data-row-type');
    const wrap = document.getElementById('itemRows');
    const idx = wrap.children.length;
    if(rowType==='tracker'){
      wrap.insertAdjacentHTML('beforeend', renderTrackerItemRow({namaBarang:'',qty:1}, idx));
    } else {
      wrap.insertAdjacentHTML('beforeend', renderQuoItemRow({namaBarang:'',qty:1,stok:'',lokasi:'',hargaBeli:0,ongkosKirim:0,materialHandling:0,marginPersen:state.settings.defaultMarginPercent}, idx));
    }
    return;
  }
  if(action==='remove-item-row'){
    const row = el.closest('[data-item-idx]');
    if(row) row.remove();
    return;
  }
  if(action==='save-quotation'){
    const form = document.getElementById('quoForm');
    const items = Array.from(document.querySelectorAll('#itemRows [data-item-idx]')).map(row=>{
      const get = (f, isNum)=>{
        const fe = row.querySelector(`[data-item-field="${f}"]`);
        if(!fe) return isNum?0:'';
        return isNum ? (Number(fe.value)||0) : fe.value;
      };
      return {
        namaBarang: get('namaBarang', false),
        qty: get('qty', true),
        stok: get('stok', false),
        lokasi: get('lokasi', false),
        hargaBeli: get('hargaBeli', true),
        ongkosKirim: get('ongkosKirim', true),
        materialHandling: get('materialHandling', true),
        marginPersen: get('marginPersen', true),
      };
    }).filter(it=>it.namaBarang);
    if(items.length===0){ showToast('Tambahkan minimal satu item barang'); return; }
    const getField = (f, isNum)=>{
      const fe = form.querySelector(`[data-field="${f}"]`);
      if(!fe) return isNum?0:'';
      return isNum ? (Number(fe.value)||0) : fe.value;
    };
    const existingId = el.getAttribute('data-id');
    state.data.quotation = state.data.quotation||[];
    const existingIdx = existingId ? state.data.quotation.findIndex(q=>q.id===existingId) : -1;
    const oldStatus = existingIdx>-1 ? state.data.quotation[existingIdx].status : null;
    const alreadyInvoiced = existingIdx>-1 ? !!state.data.quotation[existingIdx].invoiceGenerated : false;
    const alreadyPurchased = existingIdx>-1 ? !!state.data.quotation[existingIdx].pembelianGenerated : false;
    const newStatus = getField('status');

    // Keamanan: jangan izinkan lompat ke status di luar wewenang role ini
    if(!allowedQuotationStatuses(oldStatus||newStatus).includes(newStatus)){
      showToast('Anda tidak berwenang mengubah status ke '+newStatus);
      return;
    }
    // Validasi: tidak boleh "Diterima" kalau masih ada item belum ada referensi harga
    if(newStatus==='Diterima'){
      const belumLengkap = items.some(it=>(Number(it.hargaBeli)||0)<=0);
      if(belumLengkap){
        showToast('Tidak bisa set "Diterima" — masih ada item yang belum ada Harga Beli dari Procurement');
        return;
      }
    }

    const payload = {
      tanggal: getField('tanggal'),
      validUntil: getField('validUntil'),
      kodeCustomer: getField('kodeCustomer'),
      namaCustomerManual: getField('namaCustomerManual'),
      diskon: getField('diskon', true),
      status: newStatus,
      catatan: getField('catatan'),
      items,
    };
    let savedRecord;
    if(existingIdx>-1){
      state.data.quotation[existingIdx] = {...state.data.quotation[existingIdx], ...payload};
      savedRecord = state.data.quotation[existingIdx];
    } else {
      payload.id = uid('QUO');
      state.data.quotation.push(payload);
      savedRecord = payload;
    }
    saveEntity('quotation');
    state._editingQuotation = null;
    state.view='quotation.daftar';

    if(newStatus==='Diterima' && oldStatus!=='Diterima'){
      let msgParts = [];
      if(!alreadyInvoiced){
        const count = generateInvoiceFromQuotation(savedRecord);
        msgParts.push(`${count} transaksi Penjualan`);
      }
      if(!alreadyPurchased){
        const countBeli = generatePurchaseDraftFromQuotation(savedRecord);
        msgParts.push(`${countBeli} draft Pembelian`);
      }
      render();
      showToast(msgParts.length ? `Quotation diterima — ${msgParts.join(' & ')} dibuat otomatis` : 'Quotation tersimpan');
    } else {
      render();
      showToast('Quotation tersimpan');
    }
    return;
  }
  if(action==='save-tracker'){
    const form = document.getElementById('trackerForm');
    const items = Array.from(document.querySelectorAll('#itemRows [data-item-idx]')).map(row=>({
      namaBarang: row.querySelector('[data-item-field="namaBarang"]').value,
      qty: Number(row.querySelector('[data-item-field="qty"]').value)||0,
    })).filter(it=>it.namaBarang);
    if(items.length===0){ showToast('Tambahkan minimal satu kebutuhan barang'); return; }
    const getField = (f)=>{ const fe=form.querySelector(`[data-field="${f}"]`); return fe?fe.value:''; };
    if(state.user.role==='Sales'){
      if(!getField('kodeCustomer')){ showToast('Pilih Customer dari Master Data — hubungi Tim FA jika belum terdaftar'); return; }
    } else if(!getField('kodeCustomer') && !getField('namaProspek')){
      showToast('Isi Customer atau Nama Prospek'); return;
    }
    const payload = {
      tanggalInput: getField('tanggalInput'),
      nikSales: getField('nikSales'),
      kodeCustomer: getField('kodeCustomer'),
      namaProspek: getField('namaProspek'),
      kontakProspek: getField('kontakProspek'),
      statusProspek: getField('statusProspek'),
      tanggalFollowUpBerikutnya: getField('tanggalFollowUpBerikutnya'),
      catatan: getField('catatan'),
      items,
    };
    const existingId = el.getAttribute('data-id');
    state.data.salesTracker = state.data.salesTracker||[];
    if(existingId){
      const idx = state.data.salesTracker.findIndex(t=>t.id===existingId);
      if(idx>-1) state.data.salesTracker[idx] = {...state.data.salesTracker[idx], ...payload};
    } else {
      payload.id = uid('ST');
      state.data.salesTracker.push(payload);
    }
    saveEntity('salesTracker');
    state._editingSalesTracker = null;
    state.view='salestracker.pipeline'; render();
    showToast('Data prospek tersimpan');
    return;
  }
  if(action==='save-margin-settings'){
    const val = Number(document.getElementById('marginSettingInput').value);
    if(!val || val<0 || val>=100){ showToast('Margin harus di antara 0-99%'); return; }
    state.settings.defaultMarginPercent = val;
    saveSettings();
    showToast('Margin default disimpan');
    return;
  }
  if(action==='make-quotation'){
    const trackerId = el.getAttribute('data-id');
    const tracker = (state.data.salesTracker||[]).find(t=>t.id===trackerId);
    if(!tracker){ showToast('Data prospek tidak ditemukan'); return; }
    const newQuo = {
      id: uid('QUO'),
      tanggal: todayStr(),
      validUntil: '',
      kodeCustomer: tracker.kodeCustomer||'',
      namaCustomerManual: tracker.namaProspek||'',
      diskon: 0,
      status: 'Menunggu Referensi',
      catatan: '',
      salesTrackerId: tracker.id,
      items: (tracker.items||[]).map(it=>({
        namaBarang: it.namaBarang, qty: it.qty, stok:'', lokasi:'',
        hargaBeli:0, ongkosKirim:0, materialHandling:0, marginPersen: state.settings.defaultMarginPercent,
      })),
    };
    state.data.quotation = state.data.quotation||[];
    state.data.quotation.push(newQuo);
    saveEntity('quotation');
    tracker.quotationId = newQuo.id;
    saveEntity('salesTracker');
    state.view='quotation.tambah'; state._editingQuotation = newQuo; state._editingSalesTracker=null;
    render();
    showToast('Quotation dibuat dari data prospek — silakan lengkapi referensi harga');
    return;
  }
});


document.addEventListener('input', function(e){
  if(e.target.matches('[data-action="search"]')){
    state.search = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.querySelector('[data-action="search"]');
    if(el){ el.focus(); el.setSelectionRange(pos,pos); }
    return;
  }
  // live total for generic Tambah forms
  const form = e.target.closest('#entryForm');
  if(form){
    const entity = document.querySelector('[data-action="save-entry"]')?.getAttribute('data-entity');
    if(entity && SCHEMAS[entity].computed){
      const schema = SCHEMAS[entity];
      const payload = {};
      schema.fields.forEach(f=>{ const fe=form.querySelector(`[data-field="${f.key}"]`); if(fe) payload[f.key]=f.type==='number'?Number(fe.value)||0:fe.value; });
      schema.computed.forEach(c=>{
        const target = form.querySelector(`[data-live-computed="${c.key}"] b`);
        if(target) target.textContent = typeof c.fn(payload)==='number' ? rupiah(c.fn(payload)) : c.fn(payload);
      });
    }
  }
  // live update Harga Jual/Total per item & grand total pada form Quotation
  if(e.target.closest('#itemRows') && document.getElementById('quoForm')){
    const rowVal = (row, f)=>{ const fe=row.querySelector(`[data-item-field="${f}"]`); return fe?Number(fe.value)||0:0; };
    let grand = 0;
    document.querySelectorAll('#itemRows [data-item-idx]').forEach(row=>{
      const margin = rowVal(row,'marginPersen') || state.settings.defaultMarginPercent;
      const hargaJual = calcHargaJual(rowVal(row,'hargaBeli'), rowVal(row,'ongkosKirim'), rowVal(row,'materialHandling'), margin);
      const total = rowVal(row,'qty')*hargaJual;
      grand += total;
      const hjEl = row.querySelector('[data-item-computed="hargaJual"]');
      const totEl = row.querySelector('[data-item-computed="total"]');
      if(hjEl) hjEl.textContent = rupiah(hargaJual);
      if(totEl) totEl.textContent = rupiah(total);
    });
    const totalEl = document.getElementById('quoTotalVal');
    if(totalEl){
      const diskonEl = document.querySelector('[data-field="diskon"]');
      const diskon = diskonEl?Number(diskonEl.value)||0:0;
      totalEl.textContent = rupiah(grand-diskon);
    }
  }
});
document.addEventListener('change', function(e){
  if(e.target.matches('[data-action="report-month"]')){ state.reportMonth = e.target.value; render(); }
  if(e.target.matches('[data-action="select-laporan-mitra"]')){ state.reportMitra = e.target.value; render(); }
});

/* Special: intercept edit views that need a draft item outside normal dispatch */
const _origRenderView = renderView;
renderView = function(){
  if(state.view==='quotation.tambah' && state._editingQuotation){
    return renderQuotationForm(state._editingQuotation);
  }
  if(state.view==='salestracker.tambah' && state._editingSalesTracker){
    return renderSalesTrackerForm(state._editingSalesTracker);
  }
  return _origRenderView();
};

loadData();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline/first run — ignore */ });
  });
}
